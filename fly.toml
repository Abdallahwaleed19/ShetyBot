# fly.toml app configuration file generated for sehtybot on 2026-10-23T09:57:14+03:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'sehtybot'
primary_region = 'cdg'

[build]
  dockerfile = 'Dockerfile'

[deploy]
[env]
  PORT = '8080'
  WEB_HOST = '0.0.0.0'
  WEB_PORT = '8080'

[mounts]
  source = 'seha_data'
  destination = '/data'

[[services]]
  protocol = 'tcp'
  internal_port = 8080

  [[services.ports]]
    port = 80
    handlers = ['http']

  [[services.ports]]
    port = 443
    handlers = ['tls', 'http']

  [services.concurrency]
    type = 'connections'
    hard_limit = 25
    soft_limit = 20

  [[services.http_checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'get'
    path = '/'

[[vm]]
  memory = '512mb'
  cpus = 1
  memory_mb = 512
