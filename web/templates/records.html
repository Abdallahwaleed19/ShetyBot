<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>السجلات السابقة - SehtyBot</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: #0B2763;
      --card-bg: rgba(255, 255, 255, 0.07);
      --border: rgba(255, 255, 255, 0.15);
      --accent: #3b9eff;
      --green: #10b981;
      --danger: #ef4444;
      --warning: #f59e0b;
      --text: #ffffff;
      --muted: #cbd5e1;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
      min-height: 100vh;
      padding: 16px 14px 40px;
    }
    .container {
      max-width: 740px;
      margin: 0 auto;
    }

    /* Top bar */
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 12px;
    }
    .back-btn {
      background: rgba(255, 255, 255, 0.12);
      color: #fff;
      border: 1px solid var(--border);
      padding: 8px 14px;
      border-radius: 10px;
      text-decoration: none;
      font-size: 13.5px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      transition: background .15s;
    }
    .back-btn:hover { background: rgba(255, 255, 255, 0.2); }
    h1 {
      font-size: 18px;
      font-weight: 800;
      text-align: center;
      flex: 1;
    }

    /* Tabs */
    .tabs-wrap {
      display: flex;
      gap: 10px;
      margin-bottom: 18px;
      background: rgba(0, 0, 0, 0.25);
      padding: 5px;
      border-radius: 14px;
      border: 1px solid var(--border);
    }
    .tab-btn {
      flex: 1;
      padding: 11px 14px;
      border-radius: 10px;
      border: none;
      background: transparent;
      color: #cbd5e1;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all .2s;
      font-family: inherit;
    }
    .tab-btn.active {
      background: #3b9eff;
      color: #fff;
      box-shadow: 0 4px 14px rgba(59, 158, 255, 0.4);
    }
    .tab-btn.trash.active {
      background: #e11d48;
      box-shadow: 0 4px 14px rgba(225, 29, 72, 0.4);
    }
    .badge-count {
      background: rgba(255, 255, 255, 0.22);
      padding: 2px 7px;
      border-radius: 12px;
      font-size: 12px;
    }

    /* Search bar */
    .search-box {
      margin-bottom: 18px;
      position: relative;
    }
    .search-input {
      width: 100%;
      padding: 13px 18px;
      border-radius: 14px;
      border: 1.5px solid var(--border);
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
      font-size: 14.5px;
      outline: none;
      transition: border-color .2s, box-shadow .2s;
    }
    .search-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 15px rgba(59, 158, 255, 0.3);
    }
    .search-input::placeholder { color: rgba(255, 255, 255, 0.45); }

    /* Records List */
    .records-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* Record Card */
    .record-card {
      background: var(--card-bg);
      border: 1.5px solid var(--border);
      border-radius: 18px;
      padding: 18px 16px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
      transition: transform .15s, border-color .2s;
    }
    .record-card:hover {
      border-color: rgba(59, 158, 255, 0.5);
      transform: translateY(-2px);
    }
    .record-card.trashed {
      border-color: rgba(239, 68, 68, 0.4);
      background: rgba(239, 68, 68, 0.05);
    }

    .card-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 12px;
      margin-bottom: 12px;
    }
    .patient-name {
      font-size: 17px;
      font-weight: 800;
      color: #fff;
      line-height: 1.3;
    }
    .patient-name-en {
      font-size: 12.5px;
      color: #93c5fd;
      direction: ltr;
      text-align: right;
      margin-top: 2px;
    }

    .head-badges {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }
    .badge-type {
      background: var(--accent);
      color: #fff;
      padding: 3px 9px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.5px;
    }
    .badge-code {
      background: rgba(0, 0, 0, 0.35);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #38bdf8;
      font-family: monospace;
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 12.5px;
      font-weight: 700;
    }

    /* Details Grid */
    .card-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px 14px;
      margin-bottom: 16px;
      font-size: 13.5px;
    }
    .grid-item {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
    .grid-label {
      font-size: 11.5px;
      color: #93c5fd;
      opacity: 0.85;
    }
    .grid-value {
      font-weight: 600;
      color: #f8fafc;
      word-break: break-word;
    }

    /* Actions row */
    .card-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      padding-top: 14px;
      flex-wrap: wrap;
    }
    .action-btn {
      flex: 1;
      min-width: 100px;
      padding: 10px 12px;
      border-radius: 10px;
      border: none;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      text-decoration: none;
      transition: all .15s;
      font-family: inherit;
    }
    .action-btn:active { transform: scale(0.97); }

    .btn-copy {
      background: rgba(59, 158, 255, 0.18);
      border: 1px solid rgba(59, 158, 255, 0.4);
      color: #60a5fa;
    }
    .btn-copy:hover {
      background: rgba(59, 158, 255, 0.3);
      color: #fff;
    }

    .btn-edit {
      background: #10b981;
      color: #fff;
    }
    .btn-edit:hover { background: #059669; }

    .btn-trash {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.4);
      color: #fca5a5;
    }
    .btn-trash:hover {
      background: #ef4444;
      color: #fff;
    }

    .btn-restore {
      background: #10b981;
      color: #fff;
    }
    .btn-restore:hover { background: #059669; }

    .btn-perm-delete {
      background: #e11d48;
      color: #fff;
    }
    .btn-perm-delete:hover { background: #be123c; }

    .btn-pdf {
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #cbd5e1;
      flex: 0 0 auto;
      padding: 10px 14px;
    }
    .btn-pdf:hover {
      background: rgba(255, 255, 255, 0.2);
      color: #fff;
    }

    /* Empty state */
    .empty-state {
      text-align: center;
      padding: 50px 20px;
      background: var(--card-bg);
      border-radius: 20px;
      border: 1.5px dashed var(--border);
    }
    .empty-icon { font-size: 48px; margin-bottom: 12px; }
    .empty-title { font-size: 18px; font-weight: 700; margin-bottom: 6px; }
    .empty-desc { font-size: 13.5px; opacity: 0.75; margin-bottom: 20px; }

    /* Toast */
    #toast {
      position: fixed;
      bottom: 25px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: #10b981;
      color: #fff;
      padding: 12px 24px;
      border-radius: 30px;
      font-size: 14px;
      font-weight: 700;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
      z-index: 99999;
      opacity: 0;
      transition: all .25s ease-out;
      pointer-events: none;
    }
    #toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }
  </style>
</head>
<body>

<div class="container">
  <!-- Top Header -->
  <div class="top-bar">
    <div style="display:flex;gap:8px;align-items:center">
      <a href="/form" class="back-btn" id="btn-back">← فتح النموذج</a>
      <a href="/admin?key=admin123" target="_blank" class="back-btn" id="admin-dash-link" style="display:none;background:#3b9eff;border-color:#3b9eff">👑 لوحة الإدارة</a>
    </div>
    <h1>📋 سجلات وبيانات الأشخاص</h1>
    <span style="font-size:12px;opacity:0.75" id="rec-count">0 سجل</span>
  </div>

  <!-- Tabs: Active vs Trash -->
  <div class="tabs-wrap">
    <button class="tab-btn active" id="tab-active" onclick="switchTab('active')">
      <span>📋 السجلات الحالية</span>
      <span class="badge-count" id="count-active">0</span>
    </button>
    <button class="tab-btn trash" id="tab-trash" onclick="switchTab('trash')">
      <span>🗑️ سلة المحذوفات</span>
      <span class="badge-count" id="count-trash">0</span>
    </button>
  </div>

  <!-- Search Input -->
  <div class="search-box">
    <input type="text" id="searchInput" class="search-input" placeholder="🔍 ابحث بالاسم، أو رقم الهوية، أو رمز الخدمة..." oninput="filterRecords()">
  </div>

  <!-- Records Container -->
  <div id="recordsContainer" class="records-list">
    <div style="text-align:center;padding:40px">
      <div style="font-size:28px">⏳</div>
      <p style="margin-top:10px;font-size:14px;opacity:.7">جاري تحميل السجلات...</p>
    </div>
  </div>
</div>

<!-- Toast notification -->
<div id="toast">✅ تم تنفيذ العملية بنجاح!</div>

<script>
const tg = window.Telegram?.WebApp;
if (tg) { tg.ready(); tg.expand(); }

let currentTab = 'active';
let activeRecords = [];
let trashRecords = [];
let isAdmin = false;

function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2400);
}

// Copy person data to clipboard
function copyPersonData(code) {
  const pool = currentTab === 'active' ? activeRecords : trashRecords;
  const r = pool.find(item => item.service_code === code);
  if (!r) return;

  const text = 
`🏥 تقرير إجازة مرضية
👤 اسم المريض: ${r.patient_name_ar || '-'}${r.patient_name_en ? ' (' + r.patient_name_en + ')' : ''}
🪪 رقم الهوية: ${r.national_id || '-'}
🌍 الجنسية: ${r.nationality || '-'}${r.nationality_en ? ' (' + r.nationality_en + ')' : ''}
🏢 جهة العمل: ${r.employer || '-'}${r.employer_en ? ' (' + r.employer_en + ')' : ''}
⏱️ مدة الإجازة: ${r.leave_duration_days || '1'} يوم (من ${r.admission_date || '-'} إلى ${r.discharge_date || '-'})
🗓️ تاريخ الإصدار: ${r.issue_date || '-'} ${r.report_time || ''}
🏥 المستشفى: ${r.hospital_name_ar || '-'}
👨‍⚕️ الممارس: ${r.practitioner_name_ar || '-'}
🔑 رمز الخدمة: ${r.service_code || '-'}`;

  navigator.clipboard.writeText(text).then(() => {
    showToast(`📋 تم نسخ بيانات (${r.patient_name_ar || code}) بنجاح!`);
  }).catch(() => {
    prompt('نسخ بيانات الشخص:', text);
  });
}

// Edit person data -> opens form pre-filled
function editPersonData(code) {
  window.location.href = `/form?edit=${encodeURIComponent(code)}`;
}

// Soft delete record (moves to trash)
async function trashPersonData(code) {
  if (!confirm(`هل أنت متأكد من نقل السجل (${code}) إلى سلة المحذوفات؟ يمكنك استرجاعه لاحقاً.`)) {
    return;
  }
  const token = localStorage.getItem('sehty_token') || '';
  const username = localStorage.getItem('sehty_username') || '';
  const fd = new FormData();
  fd.append('service_code', code);

  try {
    const res = await fetch(`/api/records/delete?token=${encodeURIComponent(token)}&u=${encodeURIComponent(username)}`, {
      method: 'POST',
      body: fd,
      headers: { 'x-auth-token': token, 'x-username': username }
    });
    const json = await res.json();
    if (json.success) {
      showToast('🗑️ تم نقل السجل إلى سلة المحذوفات');
      await loadAllData();
    } else {
      alert('خطأ: ' + (json.error || 'تعذر حذف السجل'));
    }
  } catch (e) {
    alert('فشل الاتصال بالخادم');
  }
}

// Restore record from trash
async function restorePersonData(code) {
  const token = localStorage.getItem('sehty_token') || '';
  const username = localStorage.getItem('sehty_username') || '';
  const fd = new FormData();
  fd.append('service_code', code);

  try {
    const res = await fetch(`/api/records/restore?token=${encodeURIComponent(token)}&u=${encodeURIComponent(username)}`, {
      method: 'POST',
      body: fd,
      headers: { 'x-auth-token': token, 'x-username': username }
    });
    const json = await res.json();
    if (json.success) {
      showToast('♻️ تم استرجاع السجل إلى السجلات الحالية');
      await loadAllData();
    } else {
      alert('خطأ: ' + (json.error || 'تعذر استرجاع السجل'));
    }
  } catch (e) {
    alert('فشل الاتصال بالخادم');
  }
}

// Permanent delete (admin only)
async function permanentDeletePersonData(code) {
  if (!confirm(`⚠️ تحذير: هل أنت متأكد تماماً من حذف السجل (${code}) نهائياً؟ هذا الإجراء لا يمكن التراجع عنه!`)) {
    return;
  }
  const token = localStorage.getItem('sehty_token') || '';
  const username = localStorage.getItem('sehty_username') || '';
  const fd = new FormData();
  fd.append('service_code', code);

  try {
    const res = await fetch(`/api/records/permanent-delete?token=${encodeURIComponent(token)}&u=${encodeURIComponent(username)}`, {
      method: 'POST',
      body: fd,
      headers: { 'x-auth-token': token, 'x-username': username }
    });
    const json = await res.json();
    if (json.success) {
      showToast('❌ تم حذف السجل نهائياً من قاعدة البيانات');
      await loadAllData();
    } else {
      alert('خطأ: ' + (json.error || 'تعذر الحذف النهائي'));
    }
  } catch (e) {
    alert('فشل الاتصال بالخادم');
  }
}

// Switch between Active and Trash tabs
function switchTab(tab) {
  currentTab = tab;
  document.getElementById('tab-active').classList.toggle('active', tab === 'active');
  document.getElementById('tab-trash').classList.toggle('active', tab === 'trash');
  document.getElementById('searchInput').value = '';
  filterRecords();
}

// Render cards
function renderRecords(records) {
  const container = document.getElementById('recordsContainer');
  document.getElementById('rec-count').textContent = `${records.length} سجل`;

  if (!records || records.length === 0) {
    if (currentTab === 'active') {
      container.innerHTML = `
        <div class="empty-state">
          <div class="empty-icon">📂</div>
          <div class="empty-title">لا توجد سجلات نشطة حالياً</div>
          <div class="empty-desc">لم يتم إصدار أي تقارير بعد أو لا توجد نتائج مطابقة لبحثك</div>
          <a href="/form" class="back-btn" style="background:#3b9eff;border-color:#3b9eff;padding:12px 20px;font-size:15px">
            ➕ إنشاء أول تقرير طبي
          </a>
        </div>
      `;
    } else {
      container.innerHTML = `
        <div class="empty-state">
          <div class="empty-icon">🗑️</div>
          <div class="empty-title">سلة المحذوفات فارغة</div>
          <div class="empty-desc">لا توجد أي سجلات محذوفة في الوقت الحالي</div>
        </div>
      `;
    }
    return;
  }

  container.innerHTML = records.map(r => `
    <div class="record-card ${currentTab === 'trash' ? 'trashed' : ''}">
      <div class="card-head">
        <div>
          <div class="patient-name">${r.patient_name_ar || 'مريض غير مسمى'}</div>
          ${r.patient_name_en ? `<div class="patient-name-en">${r.patient_name_en}</div>` : ''}
        </div>
        <div class="head-badges">
          <span class="badge-type">${r.report_type || 'GSL'}</span>
          <span class="badge-code">${r.service_code}</span>
        </div>
      </div>

      <div class="card-grid">
        <div class="grid-item">
          <span class="grid-label">🪪 رقم الهوية</span>
          <span class="grid-value">${r.national_id || '-'}</span>
        </div>
        <div class="grid-item">
          <span class="grid-label">⏱️ مدة الإجازة</span>
          <span class="grid-value" style="color:#10b981;font-weight:700">
            ${r.leave_duration_days || '1'} يوم (${r.admission_date || ''} → ${r.discharge_date || ''})
          </span>
        </div>
        <div class="grid-item">
          <span class="grid-label">🗓️ تاريخ الإصدار</span>
          <span class="grid-value">${r.issue_date || '-'} ${r.report_time || ''}</span>
        </div>
        <div class="grid-item">
          <span class="grid-label">🌍 الجنسية</span>
          <span class="grid-value">${r.nationality || r.nationality_en || '-'}</span>
        </div>
        <div class="grid-item">
          <span class="grid-label">🏥 المستشفى</span>
          <span class="grid-value">${r.hospital_name_ar || '-'}</span>
        </div>
        <div class="grid-item">
          <span class="grid-label">👨‍⚕️ الممارس</span>
          <span class="grid-value">${r.practitioner_name_ar || '-'}</span>
        </div>
        ${r.employer ? `
        <div class="grid-item" style="grid-column: span 2">
          <span class="grid-label">🏢 جهة العمل</span>
          <span class="grid-value">${r.employer}${r.employer_en ? ' (' + r.employer_en + ')' : ''}</span>
        </div>` : ''}
      </div>

      <!-- Actions -->
      <div class="card-actions">
        ${currentTab === 'active' ? `
          <button class="action-btn btn-copy" onclick="copyPersonData('${r.service_code}')" title="نسخ بيانات الشخص">
            📋 نسخ
          </button>
          <button class="action-btn btn-edit" onclick="editPersonData('${r.service_code}')" title="تعديل بيانات الشخص">
            ✏️ تعديل
          </button>
          <button class="action-btn btn-trash" onclick="trashPersonData('${r.service_code}')" title="نقل إلى سلة المحذوفات">
            🗑️ سلة المحذوفات
          </button>
          <a class="action-btn btn-pdf" href="/api/download/${r.service_code}" download="SickLeave_${r.service_code}.pdf" title="تحميل PDF">
            📥 PDF
          </a>
        ` : `
          <button class="action-btn btn-restore" onclick="restorePersonData('${r.service_code}')" title="استرجاع من المحذوفات">
            ♻️ استرجاع
          </button>
          <button class="action-btn btn-copy" onclick="copyPersonData('${r.service_code}')" title="نسخ بيانات الشخص">
            📋 نسخ
          </button>
          ${isAdmin ? `
          <button class="action-btn btn-perm-delete" onclick="permanentDeletePersonData('${r.service_code}')" title="حذف نهائي">
            ❌ حذف نهائي
          </button>
          ` : ''}
        `}
      </div>
    </div>
  `).join('');
}

// Search / Filter
function filterRecords() {
  const q = document.getElementById('searchInput').value.trim().toLowerCase();
  const pool = currentTab === 'active' ? activeRecords : trashRecords;

  if (!q) {
    renderRecords(pool);
    return;
  }
  const filtered = pool.filter(r => {
    return (r.patient_name_ar && r.patient_name_ar.toLowerCase().includes(q)) ||
           (r.patient_name_en && r.patient_name_en.toLowerCase().includes(q)) ||
           (r.national_id && r.national_id.includes(q)) ||
           (r.service_code && r.service_code.toLowerCase().includes(q)) ||
           (r.hospital_name_ar && r.hospital_name_ar.toLowerCase().includes(q)) ||
           (r.employer && r.employer.toLowerCase().includes(q));
  });
  renderRecords(filtered);
}

// Load records from server
async function loadAllData() {
  const urlParams = new URLSearchParams(window.location.search);
  const qTgId = urlParams.get('telegram_user_id') || urlParams.get('tg_id') || '';
  const qUser = urlParams.get('u') || urlParams.get('username') || '';
  const qRole = urlParams.get('role') || '';

  const token = localStorage.getItem('sehty_token') || '';
  const username = localStorage.getItem('sehty_username') || qUser;
  const uid = (tg?.initDataUnsafe?.user?.id ? String(tg.initDataUnsafe.user.id) : '') || qTgId || '0';
  const uname = (tg?.initDataUnsafe?.user?.username || '') || username;

  if (qRole === 'admin' || uid === '8733335095' || uname.toLowerCase() === 'as1_oi') {
    isAdmin = true;
    const adminLink = document.getElementById('admin-dash-link');
    if (adminLink) adminLink.style.display = 'inline-flex';
  }

  const authParams = `token=${encodeURIComponent(token)}&u=${encodeURIComponent(uname)}&telegram_user_id=${uid}&role=${qRole}`;
  const headers = { 'x-auth-token': token, 'x-username': uname };

  try {
    // 1. Fetch active
    const resActive = await fetch(`/api/all-records?${authParams}`, { headers });
    const jsonActive = await resActive.json();
    if (jsonActive.success && Array.isArray(jsonActive.data)) {
      activeRecords = jsonActive.data;
      if (jsonActive.is_admin) {
        isAdmin = true;
        const adminLink = document.getElementById('admin-dash-link');
        if (adminLink) adminLink.style.display = 'inline-flex';
      }
    } else {
      activeRecords = [];
    }

    // 2. Fetch trash
    const resTrash = await fetch(`/api/trash-records?${authParams}`, { headers });
    const jsonTrash = await resTrash.json();
    if (jsonTrash.success && Array.isArray(jsonTrash.data)) {
      trashRecords = jsonTrash.data;
    } else {
      trashRecords = [];
    }

    document.getElementById('count-active').textContent = activeRecords.length;
    document.getElementById('count-trash').textContent = trashRecords.length;

    filterRecords();
  } catch (e) {
    console.error('Failed to load data:', e);
  }
}

document.addEventListener('DOMContentLoaded', loadAllData);
</script>
</body>
</html>
