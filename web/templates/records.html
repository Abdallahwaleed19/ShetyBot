<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>سجل التقارير - SehtyBot</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #09152e 0%, #0d224d 50%, #102a5c 100%);
      --card-bg: rgba(255, 255, 255, 0.05);
      --card-border: rgba(255, 255, 255, 0.12);
      --card-hover-border: rgba(56, 189, 248, 0.4);
      --card-hover-bg: rgba(255, 255, 255, 0.08);
      --accent-cyan: #06b6d4;
      --accent-blue: #3b82f6;
      --accent-emerald: #10b981;
      --accent-rose: #f43f5e;
      --accent-amber: #f59e0b;
      --text-main: #ffffff;
      --text-muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg-gradient);
      color: var(--text-main);
      font-family: 'Segoe UI', Tahoma, -apple-system, BlinkMacSystemFont, Arial, sans-serif;
      min-height: 100vh;
      padding: 14px 12px 60px;
      -webkit-font-smoothing: antialiased;
    }
    .container {
      max-width: 680px;
      margin: 0 auto;
    }

    /* Top Bar Header */
    .top-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      gap: 10px;
    }
    .header-info {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .header-title {
      font-size: 19px;
      font-weight: 800;
      color: #ffffff;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .header-subtitle {
      font-size: 12px;
      color: #38bdf8;
      font-weight: 600;
    }
    .header-badges {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .badge-pill {
      background: rgba(245, 158, 11, 0.15);
      border: 1px solid rgba(245, 158, 11, 0.35);
      color: #fbbf24;
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 12.5px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }
    .admin-pill {
      background: rgba(59, 130, 246, 0.2);
      border: 1px solid #3b82f6;
      color: #93c5fd;
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
      text-decoration: none;
      display: none;
      transition: all .2s;
    }
    .admin-pill:hover {
      background: #3b82f6;
      color: #fff;
    }

    /* Tabs: Active vs Trash */
    .tabs-wrap {
      display: flex;
      gap: 8px;
      margin-bottom: 14px;
      background: rgba(0, 0, 0, 0.3);
      padding: 4px;
      border-radius: 14px;
      border: 1px solid var(--card-border);
    }
    .tab-btn {
      flex: 1;
      padding: 10px 12px;
      border-radius: 10px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-size: 13.5px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all .2s ease;
      font-family: inherit;
    }
    .tab-btn.active {
      background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(2, 132, 199, 0.35);
    }
    .tab-btn.trash.active {
      background: linear-gradient(135deg, #e11d48 0%, #be123c 100%);
      box-shadow: 0 4px 12px rgba(225, 29, 72, 0.35);
    }
    .badge-count {
      background: rgba(255, 255, 255, 0.22);
      padding: 1px 7px;
      border-radius: 12px;
      font-size: 11.5px;
    }

    /* Search Box */
    .search-box {
      margin-bottom: 16px;
      position: relative;
    }
    .search-input {
      width: 100%;
      padding: 12px 16px;
      border-radius: 14px;
      border: 1.5px solid var(--card-border);
      background: rgba(255, 255, 255, 0.06);
      color: #fff;
      font-size: 14px;
      outline: none;
      transition: border-color .2s, box-shadow .2s;
    }
    .search-input:focus {
      border-color: #38bdf8;
      box-shadow: 0 0 14px rgba(56, 189, 248, 0.3);
      background: rgba(255, 255, 255, 0.09);
    }
    .search-input::placeholder { color: rgba(255, 255, 255, 0.45); }

    /* Records List */
    .records-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    /* Patient Card (Box) */
    .record-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 14px 16px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.22);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      transition: all .2s ease;
    }
    .record-card:hover {
      border-color: var(--card-hover-border);
      background: var(--card-hover-bg);
      transform: translateY(-1px);
    }
    .record-card.trashed {
      border-color: rgba(239, 68, 68, 0.35);
      background: rgba(239, 68, 68, 0.05);
    }

    /* Patient Info (Right Side) */
    .card-patient-info {
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-width: 0;
      flex: 1;
    }
    .patient-title {
      font-size: 16px;
      font-weight: 800;
      color: #ffffff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1.3;
    }
    .patient-subtitle {
      font-size: 12px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .sub-dot {
      opacity: 0.5;
    }

    /* Actions Row (Left Side - Inline Icons without borders) */
    .card-actions-row {
      display: flex;
      flex-direction: row;
      flex-wrap: nowrap;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
      white-space: nowrap;
    }

    /* Action Icon Buttons - Clean & Frameless */
    .action-icon {
      background: transparent;
      border: none;
      padding: 4px;
      margin: 0;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      line-height: 1;
      text-decoration: none;
      transition: transform .15s ease, opacity .15s ease;
      opacity: 0.9;
    }
    .action-icon:hover {
      opacity: 1;
      transform: scale(1.22);
    }
    .action-icon:active {
      transform: scale(0.92);
    }

    .icon-delete { color: #f43f5e; }
    .icon-edit   { color: #10b981; }
    .icon-copy   { color: #38bdf8; }
    .icon-pdf    { color: #a855f7; }
    .icon-restore{ color: #10b981; }
    .icon-perm   { color: #ef4444; }

    /* Floating Action Button (Create new report) */
    .fab-btn {
      position: fixed;
      bottom: 24px;
      left: 20px;
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: linear-gradient(135deg, #06b6d4 0%, #0284c7 100%);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      font-weight: 700;
      box-shadow: 0 6px 20px rgba(6, 182, 212, 0.45);
      text-decoration: none;
      z-index: 999;
      transition: transform .2s ease, box-shadow .2s ease;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
    .fab-btn:hover {
      transform: scale(1.08);
      box-shadow: 0 8px 24px rgba(6, 182, 212, 0.6);
    }
    .fab-btn:active {
      transform: scale(0.95);
    }

    /* Empty state */
    .empty-state {
      text-align: center;
      padding: 48px 18px;
      background: var(--card-bg);
      border-radius: 16px;
      border: 1.5px dashed var(--card-border);
    }
    .empty-icon { font-size: 42px; margin-bottom: 10px; }
    .empty-title { font-size: 17px; font-weight: 700; margin-bottom: 4px; }
    .empty-desc { font-size: 13px; color: var(--text-muted); margin-bottom: 18px; }

    /* Toast */
    #toast {
      position: fixed;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: #10b981;
      color: #fff;
      padding: 10px 22px;
      border-radius: 30px;
      font-size: 13.5px;
      font-weight: 700;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
      z-index: 99999;
      opacity: 0;
      transition: all .25s ease-out;
      pointer-events: none;
    }
    #toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }
  </style>
</head>
<body>

<div class="container">
  <!-- Top Bar -->
  <div class="top-header">
    <div class="header-info">
      <div class="header-title">
        <span>📋 سجل التقارير</span>
      </div>
      <div class="header-subtitle" id="user-sub-status">نشط • متبقي 30 يوم</div>
    </div>
    <div class="header-badges">
      <span class="badge-pill" id="rec-count">0 تقرير</span>
      <a href="/admin?key=admin123" target="_blank" class="admin-pill" id="admin-dash-link">👑 الإدارة</a>
    </div>
  </div>

  <!-- Tabs: Active vs Trash -->
  <div class="tabs-wrap">
    <button class="tab-btn active" id="tab-active" onclick="switchTab('active')">
      <span>📋 السجلات الحالية</span>
      <span class="badge-count" id="count-active">0</span>
    </button>
    <button class="tab-btn trash" id="tab-trash" onclick="switchTab('trash')">
      <span>🗑️ سلة المحذوفات</span>
      <span class="badge-count" id="count-trash">0</span>
    </button>
  </div>

  <!-- Search Input -->
  <div class="search-box">
    <input type="text" id="searchInput" class="search-input" placeholder="🔍 ابحث باسم المريض، أو رقم الهوية..." oninput="filterRecords()">
  </div>

  <!-- Records Container -->
  <div id="recordsContainer" class="records-list">
    <div style="text-align:center;padding:40px">
      <div style="font-size:28px">⏳</div>
      <p style="margin-top:10px;font-size:14px;opacity:.7">جاري تحميل السجلات...</p>
    </div>
  </div>
</div>

<!-- Floating Add Button -->
<a href="/form" class="fab-btn" id="fab-new" title="إنشاء تقرير جديد">+</a>

<!-- Toast notification -->
<div id="toast">✅ تم بنجاح</div>

<script>
const tg = window.Telegram?.WebApp;
if (tg) { tg.ready(); tg.expand(); }

let currentTab = 'active';
let activeRecords = [];
let trashRecords = [];
let isAdmin = false;

function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2200);
}

// Copy person data to clipboard
function copyPersonData(code) {
  const pool = currentTab === 'active' ? activeRecords : trashRecords;
  const r = pool.find(item => item.service_code === code);
  if (!r) return;

  const text = 
`🏥 تقرير إجازة مرضية
👤 اسم المريض: ${r.patient_name_ar || '-'}${r.patient_name_en ? ' (' + r.patient_name_en + ')' : ''}
🪪 رقم الهوية: ${r.national_id || '-'}
🌍 الجنسية: ${r.nationality || '-'}${r.nationality_en ? ' (' + r.nationality_en + ')' : ''}
🏢 جهة العمل: ${r.employer || '-'}${r.employer_en ? ' (' + r.employer_en + ')' : ''}
⏱️ مدة الإجازة: ${r.leave_duration_days || '1'} يوم (من ${r.admission_date || '-'} إلى ${r.discharge_date || '-'})
🗓️ تاريخ الإصدار: ${r.issue_date || '-'} ${r.report_time || ''}
🏥 المستشفى: ${r.hospital_name_ar || '-'}
👨‍⚕️ الممارس: ${r.practitioner_name_ar || '-'}
🔑 رمز الخدمة: ${r.service_code || '-'}`;

  navigator.clipboard.writeText(text).then(() => {
    showToast(`📋 تم نسخ بيانات (${r.patient_name_ar || code})`);
  }).catch(() => {
    prompt('نسخ بيانات الشخص:', text);
  });
}

// Edit person data -> opens form pre-filled
function editPersonData(code) {
  const urlParams = new URLSearchParams(window.location.search);
  const qTgId = urlParams.get('telegram_user_id') || urlParams.get('tg_id') || '';
  const uid = (tg?.initDataUnsafe?.user?.id ? String(tg.initDataUnsafe.user.id) : '') || qTgId || localStorage.getItem('sehty_telegram_user_id') || '';
  let url = `/form?edit=${encodeURIComponent(code)}`;
  if (uid && uid !== '0') url += `&telegram_user_id=${encodeURIComponent(uid)}`;
  window.location.href = url;
}

// Soft delete record (moves to trash)
async function trashPersonData(code) {
  if (!confirm(`هل تريد نقل هذا السجل (${code}) إلى سلة المحذوفات؟`)) return;
  const token = localStorage.getItem('sehty_token') || '';
  const username = localStorage.getItem('sehty_username') || '';
  const fd = new FormData();
  fd.append('service_code', code);

  try {
    const res = await fetch(`/api/records/delete?token=${encodeURIComponent(token)}&u=${encodeURIComponent(username)}`, {
      method: 'POST',
      body: fd,
      headers: { 'x-auth-token': token, 'x-username': username }
    });
    const json = await res.json();
    if (json.success) {
      showToast('🗑️ تم نقل السجل إلى سلة المحذوفات');
      await loadAllData();
    } else {
      alert('خطأ: ' + (json.error || 'تعذر حذف السجل'));
    }
  } catch (e) {
    alert('فشل الاتصال بالخادم');
  }
}

// Restore record from trash
async function restorePersonData(code) {
  const token = localStorage.getItem('sehty_token') || '';
  const username = localStorage.getItem('sehty_username') || '';
  const fd = new FormData();
  fd.append('service_code', code);

  try {
    const res = await fetch(`/api/records/restore?token=${encodeURIComponent(token)}&u=${encodeURIComponent(username)}`, {
      method: 'POST',
      body: fd,
      headers: { 'x-auth-token': token, 'x-username': username }
    });
    const json = await res.json();
    if (json.success) {
      showToast('♻️ تم استرجاع السجل بنجاح');
      await loadAllData();
    } else {
      alert('خطأ: ' + (json.error || 'تعذر استرجاع السجل'));
    }
  } catch (e) {
    alert('فشل الاتصال بالخادم');
  }
}

// Permanent delete (admin only)
async function permanentDeletePersonData(code) {
  if (!confirm(`⚠️ تحذير: هل أنت متأكد تماماً من حذف السجل (${code}) نهائياً؟ هذا الإجراء لا يمكن التراجع عنه!`)) return;
  const token = localStorage.getItem('sehty_token') || '';
  const username = localStorage.getItem('sehty_username') || '';
  const fd = new FormData();
  fd.append('service_code', code);

  try {
    const res = await fetch(`/api/records/permanent-delete?token=${encodeURIComponent(token)}&u=${encodeURIComponent(username)}`, {
      method: 'POST',
      body: fd,
      headers: { 'x-auth-token': token, 'x-username': username }
    });
    const json = await res.json();
    if (json.success) {
      showToast('❌ تم الحذف النهائي');
      await loadAllData();
    } else {
      alert('خطأ: ' + (json.error || 'تعذر الحذف النهائي'));
    }
  } catch (e) {
    alert('فشل الاتصال بالخادم');
  }
}

// Switch between Active and Trash tabs
function switchTab(tab) {
  currentTab = tab;
  document.getElementById('tab-active').classList.toggle('active', tab === 'active');
  document.getElementById('tab-trash').classList.toggle('active', tab === 'trash');
  document.getElementById('searchInput').value = '';
  filterRecords();
}

// Render cards

function formatLeavePeriod(r) {
  const adm = r.admission_date || '';
  const dis = r.discharge_date || '';
  if (adm && dis && adm !== dis) {
    return `${adm} إلى ${dis}`;
  }
  return adm || dis || r.issue_date || '-';
}

function renderRecords(records) {
  const container = document.getElementById('recordsContainer');
  document.getElementById('rec-count').textContent = `${records.length} تقرير`;

  if (!records || records.length === 0) {
    if (currentTab === 'active') {
      container.innerHTML = `
        <div class="empty-state">
          <div class="empty-icon">📂</div>
          <div class="empty-title">لا توجد سجلات نشطة حالياً</div>
          <div class="empty-desc">لم يتم إصدار أي تقارير بعد أو لا توجد نتائج مطابقة</div>
          <a href="/form" style="display:inline-flex;padding:10px 20px;background:#0284c7;color:#fff;border-radius:10px;text-decoration:none;font-weight:700;font-size:14px">
            ➕ إنشاء تقرير طبي جديد
          </a>
        </div>
      `;
    } else {
      container.innerHTML = `
        <div class="empty-state">
          <div class="empty-icon">🗑️</div>
          <div class="empty-title">سلة المحذوفات فارغة</div>
          <div class="empty-desc">لا توجد أي سجلات محذوفة في الوقت الحالي</div>
        </div>
      `;
    }
    return;
  }

  container.innerHTML = records.map((r) => `
    <div class="record-card ${currentTab === 'trash' ? 'trashed' : ''}">
      <!-- Patient details -->
      <div class="card-patient-info">
        <div class="patient-title">${r.patient_name_ar || 'مريض غير مسمى'}</div>
        <div class="patient-leave-date" style="font-size:13px;color:#38bdf8;font-weight:700;margin-top:3px;display:flex;align-items:center;gap:5px;">
          <span>📅 تاريخ الإجازة المرضية:</span>
          <span style="color:#ffffff">${formatLeavePeriod(r)}</span>
        </div>
      </div>

      <!-- Actions Inline Row (Only Delete and Edit icons, frameless, textless) -->
      <div class="card-actions-row">
        ${currentTab === 'active' ? `
          <button class="action-icon icon-delete" onclick="trashPersonData('${r.service_code}')" title="حذف">🗑️</button>
          <button class="action-icon icon-edit" onclick="editPersonData('${r.service_code}')" title="تعديل">✏️</button>
        ` : `
          ${isAdmin ? `
            <button class="action-icon icon-perm" onclick="permanentDeletePersonData('${r.service_code}')" title="حذف نهائي">❌</button>
          ` : ''}
          <button class="action-icon icon-restore" onclick="restorePersonData('${r.service_code}')" title="استرجاع">♻️</button>
        `}
      </div>
    </div>
  `).join('');
}

// Search / Filter
function filterRecords() {
  const q = document.getElementById('searchInput').value.trim().toLowerCase();
  const pool = currentTab === 'active' ? activeRecords : trashRecords;

  if (!q) {
    renderRecords(pool);
    return;
  }
  const filtered = pool.filter(r => {
    return (r.patient_name_ar && r.patient_name_ar.toLowerCase().includes(q)) ||
           (r.patient_name_en && r.patient_name_en.toLowerCase().includes(q)) ||
           (r.national_id && r.national_id.includes(q)) ||
           (r.service_code && r.service_code.toLowerCase().includes(q)) ||
           (r.hospital_name_ar && r.hospital_name_ar.toLowerCase().includes(q)) ||
           (r.employer && r.employer.toLowerCase().includes(q));
  });
  renderRecords(filtered);
}

// Load records from server
async function loadAllData() {
  const urlParams = new URLSearchParams(window.location.search);
  const qTgId = urlParams.get('telegram_user_id') || urlParams.get('tg_id') || '';
  const qUser = urlParams.get('u') || urlParams.get('username') || '';
  const qRole = urlParams.get('role') || '';

  const token = localStorage.getItem('sehty_token') || '';
  const username = localStorage.getItem('sehty_username') || qUser;
  const uid = (tg?.initDataUnsafe?.user?.id ? String(tg.initDataUnsafe.user.id) : '') || qTgId || '0';
  const uname = (tg?.initDataUnsafe?.user?.username || '') || username;

  if (qRole === 'admin' || uid === '8733335095' || uname.toLowerCase() === 're_i1i' || uname.toLowerCase() === 'as1_oi') {
    isAdmin = true;
    const adminLink = document.getElementById('admin-dash-link');
    if (adminLink) adminLink.style.display = 'inline-flex';
  }

  const authParams = `token=${encodeURIComponent(token)}&u=${encodeURIComponent(uname)}&telegram_user_id=${uid}&role=${qRole}&key=admin123`;
  const headers = { 'x-auth-token': token, 'x-username': uname };

  // 1. Fetch active safely
  try {
    const resActive = await fetch(`/api/all-records?${authParams}`, { headers });
    const jsonActive = await resActive.json();
    if (jsonActive.success && Array.isArray(jsonActive.data)) {
      activeRecords = jsonActive.data;
      activeRecords.sort((a, b) => (b.created_at || '').localeCompare(a.created_at || ''));
      if (jsonActive.is_admin) {
        isAdmin = true;
        const adminLink = document.getElementById('admin-dash-link');
        if (adminLink) adminLink.style.display = 'inline-flex';
      }
    } else {
      activeRecords = [];
    }
  } catch (eActive) {
    console.error('Error fetching active records:', eActive);
    activeRecords = [];
  }

  // 2. Fetch trash safely
  try {
    const resTrash = await fetch(`/api/trash-records?${authParams}`, { headers });
    const jsonTrash = await resTrash.json();
    if (jsonTrash.success && Array.isArray(jsonTrash.data)) {
      trashRecords = jsonTrash.data;
      trashRecords.sort((a, b) => (b.deleted_at || b.created_at || '').localeCompare(a.deleted_at || a.created_at || ''));
    } else {
      trashRecords = [];
    }
  } catch (eTrash) {
    console.error('Error fetching trash records:', eTrash);
    trashRecords = [];
  }

  // Update count badges
  document.getElementById('count-active').textContent = activeRecords.length;
  document.getElementById('count-trash').textContent = trashRecords.length;

  // Immediate render on load
  filterRecords();
}

// Auto-sync every 25 seconds for real-time updates
setInterval(loadAllData, 25000);

document.addEventListener('DOMContentLoaded', loadAllData);
</script>
</body>
</html>
